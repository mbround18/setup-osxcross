name: Demo Workflow
on: [push]

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: ./
        with:
          osx-version: "12.3"

      - name: Cloning Hello World
        uses: actions/checkout@v7
        with:
          repository: mbround18/rs-simple-hello-world
          path: rs-simple-hello-world

      - name: Build Hello World (x86_64)
        working-directory: ./rs-simple-hello-world
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build Hello World (aarch64)
        working-directory: ./rs-simple-hello-world
        run: cargo build --release --target aarch64-apple-darwin

      - name: Grab Binaries
        uses: actions/upload-artifact@v7
        with:
          name: hello-world
          path: |
            ./rs-simple-hello-world/target/x86_64-apple-darwin/release/rs-simple-hello-world
            ./rs-simple-hello-world/target/aarch64-apple-darwin/release/rs-simple-hello-world
